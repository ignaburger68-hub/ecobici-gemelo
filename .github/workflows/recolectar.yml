# menos minutos y queda un hueco corto en los datos.
 
name: Recolectar Ecobici
 
on:
  schedule:
    - cron: "3,33 * * * *"
  workflow_dispatch:          # botón "Run workflow" para probar a mano
    inputs:
      minutos:
        description: "Minutos a leer (vacío = hasta la próxima ejecución programada)"
        required: false
        default: ""
 
permissions:
  contents: write             # permite subir los datos al repositorio
 
concurrency:
  group: recolector           # nunca dos ejecuciones al mismo tiempo
  cancel-in-progress: false
 
jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
 
      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
 
      - name: Instalar jsonlite
        run: Rscript -e 'install.packages("jsonlite")'
 
      - name: Leer el feed
        env:
          MINUTOS_MANUAL: ${{ github.event.inputs.minutos }}
        run: |
          if [[ "$MINUTOS_MANUAL" =~ ^[0-9]+$ ]]; then
            M=$MINUTOS_MANUAL
          else
            AHORA=$((10#$(date -u +%M)))
            M=$(( (32 - AHORA + 60) % 30 ))
            if [ "$M" -lt 1 ]; then M=1; fi
          fi
          echo "Leyendo durante $M minutos"
          Rscript recolector_ecobici.R --minutos=$M
 
      - name: Subir los datos al repositorio
        if: always()
        run: |
          git config user.name "recolector-ecobici"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos
          if git diff --cached --quiet; then
            echo "No hay datos nuevos"
            exit 0
          fi
          git commit -m "Lecturas $(date -u +'%Y-%m-%d %H:%M') UTC"
          for intento in 1 2 3; do
            git pull --rebase && git push && break
            sleep 10
          done
